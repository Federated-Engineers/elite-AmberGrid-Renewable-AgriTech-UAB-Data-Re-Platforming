version: 2

models:
  - name: stg_postgres__plants
    description: >
      One row per plant, typed from the raw_record VARIANT. Includes plants
      removed from the source, flagged by is_current_in_source.
    columns:
      - name: plant_id
        description: Plant identifier, in the form PLANT-001.
        tests:
          - unique
          - not_null

      - name: plant_name
        description: Site name. Not unique, do not join on it.

      - name: plant_type
        description: Type of facility at the site.

      - name: city
        description: City the plant operates in.

      - name: country
        description: Country the plant operates in.

      - name: capacity_tons_per_day
        description: Rated processing capacity, tonnes per day.

      - name: num_bioreactors
        description: Bioreactors installed at the plant.

      - name: commissioned_date
        description: Date the plant entered service.

      - name: last_seen_date
        description: Date the plant was last present in a source load.

      - name: is_current_in_source
        description: False once the plant is removed upstream. The merge never deletes.

      - name: _source_file_name
        description: Staged file the row came from. Audit only.

      - name: _last_modified_at
        description: When the merge last changed the row. Audit only.
