version: 2

sources:
  - name: postgres
    description: >
      AmberGrid operational Postgres, landed into bronze daily by Airflow.
      Each table is merged on its business key, so bronze holds one row per
      key. The merge never deletes.

    database: "{{ target.database }}"
    schema: bronze
    loader: airflow
    config:
      tags:
        - bronze
        - postgres

    tables:
      - name: plants
        identifier: pg_plants
        description: One row per plant. Merged on plant_id.
        columns:
          - name: raw_record
            description: >
              Source row as received, keyed by column name. Keys: plant_id,
              plant_name, plant_type, city, country, commissioned_date,
              capacity_tons_per_day, num_bioreactors.
            tests:
              - not_null

          - name: source_table
            description: Table name in the ambergrid schema.
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['plants']

          - name: snapshot_date
            description: Date the row was last seen in the source.
            tests:
              - not_null

          - name: source_file_name
            description: Staged file the row was loaded from.
            tests:
              - not_null

          - name: file_row_number
            description: Row position within the staged file.

          - name: file_last_modified
            description: When the staged file was last written.

          - name: file_content_key
            description: Checksum of the staged file.

          - name: loaded_at
            description: When the merge last inserted or updated the row.
            tests:
              - not_null
